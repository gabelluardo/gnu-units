name: QA & sanity checks

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUST_LOG: info
    RUST_BACKTRACE: 1

jobs:
    rust-sanity:
        name: "Rust: Code sanity (${{ matrix.features }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                features:
                    - ""
                    - "--features currency-update"
                    - "--no-default-features --features vendored"
                    - "--no-default-features --features vendored,currency-update"
        steps:
            - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
            - uses: actions/checkout@v4
              with:
                  token: ${{ github.token }}
                  submodules: true
            - name: Install Rust stable toolchain
              run: rustup update stable
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Clippy
              run: cargo clippy --workspace ${{ matrix.features }} -- -D warnings
            - name: Clippy (tests)
              run: cargo clippy --workspace --tests ${{ matrix.features }} -- -D warnings

    rust-tests:
        name: "Rust: Tests and coverage (${{ matrix.features }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                features:
                    - ""
                    - "--features currency-update"
                    - "--no-default-features --features vendored"
                    - "--no-default-features --features vendored,bindgen"
                    - "--no-default-features --features vendored,currency-update"
        steps:
            - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
            - uses: actions/checkout@v4
              with:
                  token: ${{ github.token }}
                  submodules: true
            - name: Install nextest and cargo-llvm-cov
              uses: taiki-e/install-action@v2
              with:
                  tool: nextest,cargo-llvm-cov
            - name: Install Rust stable toolchain
              run: rustup update stable
            - name: Run tests
              run: cargo nextest run --workspace ${{ matrix.features }}
            - name: Collect coverage
              run: |
                  cargo llvm-cov nextest \
                    --workspace \
                    ${{ matrix.features }} \
                    --ignore-filename-regex "_test\.rs$" \
                    --lcov \
                    --output-path lcov.info
            # Codecov upload is currently disabled as the project is private.
            #- name: Upload coverage to Codecov
            #  uses: codecov/codecov-action@v5
            #  with:
            #      token: ${{ secrets.CODECOV_TOKEN }}
            #      files: lcov.info
            #      fail_ci_if_error: false
