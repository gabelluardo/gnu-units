name: QA & sanity checks

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUST_LOG: info
    RUST_BACKTRACE: 1

jobs:
    rust-sanity:
        name: "Rust: Code sanity"
        runs-on: ubuntu-latest
        steps:
            - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
            - uses: actions/checkout@v7
              with:
                  token: ${{ github.token }}
                  submodules: true
            - name: Install Rust stable toolchain
              run: rustup update stable
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Clippy
              run: |
                  set -euo pipefail
                  combos=(
                      ""
                      "--features currency-update"
                      "--no-default-features --features vendored"
                      "--no-default-features --features vendored,currency-update"
                  )
                  for features in "${combos[@]}"; do
                      echo "::group::clippy ${features:-(default)}"
                      cargo clippy --workspace $features -- -D warnings
                      echo "::endgroup::"
                  done
            - name: Clippy (tests)
              run: |
                  set -euo pipefail
                  combos=(
                      ""
                      "--features currency-update"
                      "--no-default-features --features vendored"
                      "--no-default-features --features vendored,currency-update"
                  )
                  for features in "${combos[@]}"; do
                      echo "::group::clippy --tests ${features:-(default)}"
                      cargo clippy --workspace --tests $features -- -D warnings
                      echo "::endgroup::"
                  done

    rust-tests:
        name: "Rust: Tests and coverage"
        runs-on: ubuntu-latest
        steps:
            - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
            - uses: actions/checkout@v7
              with:
                  token: ${{ github.token }}
                  submodules: true
            - name: Install nextest and cargo-llvm-cov
              uses: taiki-e/install-action@v2
              with:
                  tool: nextest,cargo-llvm-cov
            - name: Install Rust stable toolchain
              run: rustup update stable
            - name: Tests
              run: |
                  set -euo pipefail
                  combos=(
                      ""
                      "--features currency-update"
                      "--no-default-features --features vendored"
                      "--no-default-features --features vendored,bindgen"
                      "--no-default-features --features vendored,currency-update"
                  )
                  for features in "${combos[@]}"; do
                      echo "::group::nextest ${features:-(default)}"
                      cargo nextest run --workspace $features
                      echo "::endgroup::"
                  done
            - name: Collect coverage
              run: |
                  cargo llvm-cov nextest \
                    --workspace \
                    --ignore-filename-regex "_test\.rs$" \
                    --lcov \
                    --output-path lcov.info
            # Codecov upload is currently disabled as the project is private.
